name: Build and Lint

on:
  push:
    branches: [ master ]
    paths:
      - src/**
      - homebridge-ui/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/build.yml
  pull_request:
    branches: [ master ]
    paths:
      - src/**
      - homebridge-ui/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build
        env:
          CI: true

  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the project
        run: npm run lint
